apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-observability-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY.git
    targetRevision: main
    path: Monitorting_Observability_GitOps/monitoring
    directory:
      exclude: alert-rule.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
